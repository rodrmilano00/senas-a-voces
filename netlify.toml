[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/api/training-data/manifest"
  to = "/training_data/manifest.json"
  status = 200

[[redirects]]
  from = "/api/training-data/:cat/:file"
  to = "/training_data/:cat/:file"
  status = 200

[[redirects]]
  from = "/api/training-data/:file"
  to = "/training_data/:file"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
